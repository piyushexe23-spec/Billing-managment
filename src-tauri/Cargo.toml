[package]
name = "im-medicos"
version = "0.1.0"
description = "IM MEDICOS Medical Billing Software"
authors = ["IM MEDICOS Team"]
edition = "2021"

[lib]
name = "im_medicos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
thiserror = "1.0"
log = "0.4"
