  <line x1="256" y1="864" x2="1440" y2="864" stroke="#e2e8f0" stroke-width="1"/>
  <text x="280" y="886" fill="#94a3b8" font-size="11">IM MEDICOS v0.1.0 • Windows Desktop Edition</text>
