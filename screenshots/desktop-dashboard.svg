  <text x="880" y="605" fill="#0f172a" font-size="11" font-weight="600">Insulin Glargine 100IU</text>
  <text x="1270" y="605" fill="#ef4444" font-size="11" font-weight="700">2 Vials</text>
  <text x="880" y="635" fill="#0f172a" font-size="11" font-weight="600">Montek LC Tablet</text>
