  <rect x="21" y="30" width="18" height="4" rx="1.5" fill="#4ade80"/>
  <text x="54" y="36" fill="#ffffff" font-size="15" font-weight="800" letter-spacing="-0.5">IM <tspan fill="#b6c8de">MEDICOS</tspan><tspan fill="#10b981">.</tspan></text>

  <!-- Sidebar Navigation Items -->
  <!-- Active Dashboard -->
